<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎲 주사위 게임</title>
<style>
  /* ===== 기본 리셋 & 공통 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --player-color: #3b82f6;
    --computer-color: #db2777;
    --draw-color: #d97706;
    --panel-bg: rgba(255, 255, 255, 0.82);
  }

  body {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
    font-family: "Segoe UI", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(120deg, #ff9ecb, #ffd479, #a6ff96, #7ee8fa, #b892ff, #ff9ecb);
    background-size: 400% 400%;
    animation: rainbowFlow 16s ease infinite;
    color: #334155;
  }

  @keyframes rainbowFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* 둥실둥실 떠다니는 반짝이 장식 */
  .sparkle {
    position: fixed;
    font-size: 1.6rem;
    pointer-events: none;
    opacity: 0.85;
    animation: floatSparkle 6s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
    z-index: 0;
  }
  .sparkle.s1 { top: 8%;  left: 6%;  animation-delay: 0s; }
  .sparkle.s2 { top: 18%; right: 8%; animation-delay: 1.2s; font-size: 1.2rem; }
  .sparkle.s3 { bottom: 12%; left: 10%; animation-delay: 2.4s; font-size: 1.3rem; }
  .sparkle.s4 { bottom: 20%; right: 12%; animation-delay: 0.6s; }
  .sparkle.s5 { top: 45%; left: 3%; animation-delay: 1.8s; font-size: 1.1rem; }
  .sparkle.s6 { top: 50%; right: 4%; animation-delay: 3s; font-size: 1.4rem; }

  @keyframes floatSparkle {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
    50% { transform: translateY(-18px) rotate(15deg); opacity: 1; }
  }

  .game-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 720px;
    background: var(--panel-bg);
    backdrop-filter: blur(14px);
    border: 3px solid rgba(255, 255, 255, 0.7);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(131, 58, 180, 0.35);
    padding: 36px 24px 32px;
  }

  /* ===== 상단 타이틀 ===== */
  .header { position: relative; text-align: center; margin-bottom: 24px; }
  .header h1 {
    font-size: 2rem;
    margin-bottom: 8px;
    color: #db2777;
    text-shadow: 0 2px 0 rgba(255,255,255,0.7);
  }
  .header p { color: #7c3aed; font-size: 0.95rem; font-weight: 600; }
  .mascot {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2.2rem;
    animation: bounceMascot 2.2s ease-in-out infinite;
  }
  @keyframes bounceMascot {
    0%, 100% { transform: translateX(-50%) translateY(0) rotate(-4deg); }
    50% { transform: translateX(-50%) translateY(-10px) rotate(4deg); }
  }

  /* ===== 점수판 ===== */
  .scoreboard {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: rgba(255, 255, 255, 0.55);
    border: 2px dashed rgba(219, 39, 119, 0.25);
    border-radius: 18px;
    padding: 16px 8px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .score-item { text-align: center; min-width: 80px; padding: 6px 10px; border-radius: 14px; }
  .score-item.player { box-shadow: inset 0 0 0 2px rgba(59, 130, 246, 0.35); }
  .score-item.computer { box-shadow: inset 0 0 0 2px rgba(219, 39, 119, 0.35); }
  .score-item.draw { box-shadow: inset 0 0 0 2px rgba(217, 119, 6, 0.35); }
  .score-label { font-size: 0.85rem; color: #64748b; margin-bottom: 4px; font-weight: 600; }
  .score-value { font-size: 1.6rem; font-weight: 800; }
  .score-item.player .score-value { color: var(--player-color); }
  .score-item.computer .score-value { color: var(--computer-color); }
  .score-item.draw .score-value { color: var(--draw-color); }
  .score-divider { width: 1px; height: 36px; background: rgba(124, 58, 237, 0.15); }

  /* ===== 게임 영역 (플레이어 vs 컴퓨터) ===== */
  .arena {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .player-zone {
    flex: 1;
    min-width: 140px;
    max-width: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 18px 12px;
    border-radius: 18px;
    border: 2px solid transparent;
    transition: border-color 0.3s ease, transform 0.3s ease;
  }
  .player-zone.player-side {
    background: linear-gradient(160deg, #e0f2fe, #ede9fe);
    border-color: rgba(59, 130, 246, 0.35);
  }
  .player-zone.computer-side {
    background: linear-gradient(160deg, #ffe4f1, #fce7f3);
    border-color: rgba(219, 39, 119, 0.35);
  }
  .player-zone .zone-name {
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.5px;
  }
  .player-zone.player-side .zone-name { color: var(--player-color); }
  .player-zone.computer-side .zone-name { color: var(--computer-color); }

  .vs-label {
    font-size: 1.4rem;
    font-weight: 800;
    color: #a855f7;
    padding: 0 4px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.8);
  }

  /* ===== 주사위 ===== */
  .die {
    position: relative;
    width: 90px;
    height: 90px;
    background: #fffdf7;
    border-radius: 16px;
    box-shadow: 0 6px 14px rgba(131, 58, 180, 0.25), inset 0 0 0 2px rgba(0,0,0,0.05);
  }

  /* 주사위 모서리의 작은 반짝이 장식 */
  .die::after {
    content: "✨";
    position: absolute;
    top: -12px;
    right: -10px;
    font-size: 1.05rem;
    animation: twinkleDie 1.6s ease-in-out infinite;
  }
  @keyframes twinkleDie {
    0%, 100% { opacity: 0.4; transform: scale(0.85) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.1) rotate(20deg); }
  }

  .die-face {
    position: absolute;
    inset: 10px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
  }

  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #db2777;
    place-self: center;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .dot-tl { grid-column: 1; grid-row: 1; }
  .dot-tm { grid-column: 2; grid-row: 1; }
  .dot-tr { grid-column: 3; grid-row: 1; }
  .dot-ml { grid-column: 1; grid-row: 2; }
  .dot-mm { grid-column: 2; grid-row: 2; }
  .dot-mr { grid-column: 3; grid-row: 2; }
  .dot-bl { grid-column: 1; grid-row: 3; }
  .dot-bm { grid-column: 2; grid-row: 3; }
  .dot-br { grid-column: 3; grid-row: 3; }

  /* 숫자별 점 표시 규칙 */
  .die[data-value="1"] .dot-mm,
  .die[data-value="2"] .dot-tl, .die[data-value="2"] .dot-br,
  .die[data-value="3"] .dot-tl, .die[data-value="3"] .dot-mm, .die[data-value="3"] .dot-br,
  .die[data-value="4"] .dot-tl, .die[data-value="4"] .dot-tr, .die[data-value="4"] .dot-bl, .die[data-value="4"] .dot-br,
  .die[data-value="5"] .dot-tl, .die[data-value="5"] .dot-tr, .die[data-value="5"] .dot-mm, .die[data-value="5"] .dot-bl, .die[data-value="5"] .dot-br,
  .die[data-value="6"] .dot-tl, .die[data-value="6"] .dot-tr, .die[data-value="6"] .dot-ml, .die[data-value="6"] .dot-mr, .die[data-value="6"] .dot-bl, .die[data-value="6"] .dot-br {
    opacity: 1;
    transform: scale(1);
  }

  .question-mark {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    font-weight: 800;
    color: #c4b5fd;
  }
  .die[data-value="0"] .question-mark { display: flex; }

  /* 굴리는 중 흔들림 애니메이션 */
  .die.rolling {
    animation: shake 0.25s infinite;
  }
  @keyframes shake {
    0% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-8deg) scale(1.03); }
    50% { transform: rotate(6deg) scale(0.97); }
    75% { transform: rotate(-4deg) scale(1.02); }
    100% { transform: rotate(0deg) scale(1); }
  }

  /* 결과 확정 시 등장 애니메이션 */
  .die.settled {
    animation: settle 0.35s ease;
  }
  @keyframes settle {
    0% { transform: scale(1.25) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .current-number { font-size: 0.9rem; color: #7c3aed; font-weight: 600; }

  /* ===== 결과 표시 ===== */
  .result-area {
    text-align: center;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 24px;
  }

  .result-message {
    font-size: 1.5rem;
    font-weight: 800;
    color: #64748b;
  }
  .result-message.appear {
    animation: pop-in 0.4s ease;
  }
  @keyframes pop-in {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .result-message.win { color: #16a34a; }
  .result-message.lose { color: #db2777; }
  .result-message.draw { color: #d97706; }

  .result-detail {
    font-size: 1rem;
    color: #7c3aed;
    font-weight: 600;
  }

  /* ===== 버튼 ===== */
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    padding: 14px 22px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: #fff;
    transition: transform 0.15s ease, filter 0.2s ease, opacity 0.2s ease;
  }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 3px solid #f472b6; outline-offset: 2px; }

  #rollBtn {
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    box-shadow: 0 6px 16px rgba(236, 72, 153, 0.4);
  }
  #rollBtn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-2px); }
  #rollBtn:disabled { opacity: 0.55; cursor: not-allowed; }

  #resetRoundBtn {
    background: linear-gradient(135deg, #34d399, #38bdf8);
  }
  #resetRoundBtn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-2px); }

  #resetScoreBtn {
    background: transparent;
    color: #db2777;
    border: 2px solid rgba(219, 39, 119, 0.4);
  }
  #resetScoreBtn:hover { background: rgba(219, 39, 119, 0.1); }

  /* ===== 반응형 (모바일) ===== */
  @media (max-width: 560px) {
    .arena { flex-direction: column; }
    .vs-label { transform: rotate(90deg); margin: 4px 0; }
    .player-zone { max-width: 100%; width: 100%; }
    button { flex: 1 1 100%; }
  }
</style>
</head>
<body>

  <!-- 배경 위를 둥실둥실 떠다니는 반짝이 장식 (장식용, 스크린리더 무시) -->
  <span class="sparkle s1" aria-hidden="true">✨</span>
  <span class="sparkle s2" aria-hidden="true">⭐</span>
  <span class="sparkle s3" aria-hidden="true">💖</span>
  <span class="sparkle s4" aria-hidden="true">🌟</span>
  <span class="sparkle s5" aria-hidden="true">💫</span>
  <span class="sparkle s6" aria-hidden="true">✨</span>

  <main class="game-card">
    <!-- 상단 타이틀 -->
    <header class="header">
      <span class="mascot" aria-hidden="true">🐰</span>
      <h1>🎲 주사위 게임</h1>
      <p>플레이어와 컴퓨터 중 더 높은 숫자가 승리합니다! (๑˃̵ᴗ˂̵)و</p>
    </header>

    <!-- 점수판 -->
    <section class="scoreboard" aria-label="누적 점수">
      <div class="score-item player">
        <div class="score-label">플레이어</div>
        <div class="score-value"><span id="playerScore">0</span>승</div>
      </div>
      <div class="score-divider"></div>
      <div class="score-item computer">
        <div class="score-label">컴퓨터</div>
        <div class="score-value"><span id="computerScore">0</span>승</div>
      </div>
      <div class="score-divider"></div>
      <div class="score-item draw">
        <div class="score-label">무승부</div>
        <div class="score-value"><span id="drawScore">0</span>회</div>
      </div>
    </section>

    <!-- 게임 영역 -->
    <section class="arena">
      <div class="player-zone player-side">
        <div class="zone-name">플레이어</div>
        <div id="playerDie" class="die" data-value="0" role="img" aria-label="플레이어 주사위, 아직 굴리지 않음">
          <div class="die-face">
            <span class="dot dot-tl"></span><span class="dot dot-tm"></span><span class="dot dot-tr"></span>
            <span class="dot dot-ml"></span><span class="dot dot-mm"></span><span class="dot dot-mr"></span>
            <span class="dot dot-bl"></span><span class="dot dot-bm"></span><span class="dot dot-br"></span>
          </div>
          <span class="question-mark">?</span>
        </div>
        <div class="current-number">현재 숫자: <span id="playerNumberText">?</span></div>
      </div>

      <div class="vs-label">VS</div>

      <div class="player-zone computer-side">
        <div class="zone-name">컴퓨터</div>
        <div id="computerDie" class="die" data-value="0" role="img" aria-label="컴퓨터 주사위, 아직 굴리지 않음">
          <div class="die-face">
            <span class="dot dot-tl"></span><span class="dot dot-tm"></span><span class="dot dot-tr"></span>
            <span class="dot dot-ml"></span><span class="dot dot-mm"></span><span class="dot dot-mr"></span>
            <span class="dot dot-bl"></span><span class="dot dot-bm"></span><span class="dot dot-br"></span>
          </div>
          <span class="question-mark">?</span>
        </div>
        <div class="current-number">현재 숫자: <span id="computerNumberText">?</span></div>
      </div>
    </section>

    <!-- 결과 표시 -->
    <section class="result-area" aria-live="polite">
      <div id="resultMessage" class="result-message">주사위를 굴려보세요!</div>
      <div id="resultDetail" class="result-detail"></div>
    </section>

    <!-- 버튼 -->
    <section class="controls">
      <button id="rollBtn" type="button">🎲 주사위 굴리기</button>
      <button id="resetRoundBtn" type="button">🔄 다시 하기</button>
      <button id="resetScoreBtn" type="button">🗑️ 점수 초기화</button>
    </section>
  </main>

  <script>
    // ===== 게임 상태 =====
    const state = {
      playerScore: 0,
      computerScore: 0,
      drawScore: 0,
      playerDice: 0,   // 0은 "아직 굴리지 않음"을 의미
      computerDice: 0,
      isRolling: false,
    };

    // ===== DOM 요소 캐싱 =====
    const rollBtn = document.getElementById("rollBtn");
    const resetRoundBtn = document.getElementById("resetRoundBtn");
    const resetScoreBtn = document.getElementById("resetScoreBtn");

    const playerDieEl = document.getElementById("playerDie");
    const computerDieEl = document.getElementById("computerDie");
    const playerNumberText = document.getElementById("playerNumberText");
    const computerNumberText = document.getElementById("computerNumberText");

    const resultMessageEl = document.getElementById("resultMessage");
    const resultDetailEl = document.getElementById("resultDetail");

    const playerScoreEl = document.getElementById("playerScore");
    const computerScoreEl = document.getElementById("computerScore");
    const drawScoreEl = document.getElementById("drawScore");

    // 1~6 사이의 랜덤 정수를 반환
    function rollDice() {
      return Math.floor(Math.random() * 6) + 1;
    }

    // 주사위 DOM에 값 반영 (dot 표시, 텍스트, aria-label)
    function updateDice(dieEl, textEl, value, label) {
      dieEl.setAttribute("data-value", value);
      dieEl.setAttribute("aria-label", `${label} 주사위, 현재 숫자 ${value}`);
      textEl.textContent = value;
    }

    // 승패 판정 후 결과 문구 + 색상 표시
    function displayResult(playerValue, computerValue) {
      let message = "";
      let detail = `플레이어 ${playerValue} : 컴퓨터 ${computerValue}`;
      let resultClass = "draw";

      if (playerValue > computerValue) {
        message = "🎉 플레이어 승리! ٩(ˊᗜˋ*)و";
        resultClass = "win";
      } else if (computerValue > playerValue) {
        message = "💻 컴퓨터 승리! (╥﹏╥)";
        resultClass = "lose";
      } else {
        message = "🤝 무승부! (・_・;)";
        resultClass = "draw";
      }

      resultMessageEl.textContent = message;
      resultDetailEl.textContent = detail;

      // 등장 애니메이션 재적용
      resultMessageEl.classList.remove("appear", "win", "lose", "draw");
      void resultMessageEl.offsetWidth; // 리플로우 강제(애니메이션 재시작용)
      resultMessageEl.classList.add("appear", resultClass);

      return resultClass;
    }

    // 결과에 따라 누적 점수 업데이트
    function updateScore(resultClass) {
      if (resultClass === "win") {
        state.playerScore++;
      } else if (resultClass === "lose") {
        state.computerScore++;
      } else {
        state.drawScore++;
      }
      playerScoreEl.textContent = state.playerScore;
      computerScoreEl.textContent = state.computerScore;
      drawScoreEl.textContent = state.drawScore;
    }

    // 주사위 굴리기 애니메이션 후 최종 결과 반영
    function playRollAnimation() {
      state.isRolling = true;
      rollBtn.disabled = true;

      playerDieEl.classList.remove("settled");
      computerDieEl.classList.remove("settled");
      playerDieEl.classList.add("rolling");
      computerDieEl.classList.add("rolling");

      resultMessageEl.classList.remove("appear", "win", "lose", "draw");
      resultMessageEl.textContent = "굴리는 중...";
      resultDetailEl.textContent = "";

      // 애니메이션 동안 숫자가 빠르게 바뀌는 것처럼 표시
      const flickerInterval = setInterval(() => {
        updateDice(playerDieEl, playerNumberText, rollDice(), "플레이어");
        updateDice(computerDieEl, computerNumberText, rollDice(), "컴퓨터");
      }, 80);

      setTimeout(() => {
        clearInterval(flickerInterval);

        // 최종 주사위 값 확정
        state.playerDice = rollDice();
        state.computerDice = rollDice();

        updateDice(playerDieEl, playerNumberText, state.playerDice, "플레이어");
        updateDice(computerDieEl, computerNumberText, state.computerDice, "컴퓨터");

        playerDieEl.classList.remove("rolling");
        computerDieEl.classList.remove("rolling");
        playerDieEl.classList.add("settled");
        computerDieEl.classList.add("settled");

        const resultClass = displayResult(state.playerDice, state.computerDice);
        updateScore(resultClass);

        state.isRolling = false;
        rollBtn.disabled = false;
      }, 900);
    }

    // 이번 라운드만 초기화 (누적 점수는 유지)
    function resetRound() {
      if (state.isRolling) return;

      state.playerDice = 0;
      state.computerDice = 0;

      playerDieEl.classList.remove("rolling", "settled");
      computerDieEl.classList.remove("rolling", "settled");
      updateDice(playerDieEl, playerNumberText, 0, "플레이어");
      updateDice(computerDieEl, computerNumberText, 0, "컴퓨터");
      playerNumberText.textContent = "?";
      computerNumberText.textContent = "?";

      resultMessageEl.classList.remove("appear", "win", "lose", "draw");
      resultMessageEl.textContent = "주사위를 굴려보세요!";
      resultDetailEl.textContent = "";
    }

    // 누적 점수를 0으로 초기화 (확인 후 실행)
    function resetScore() {
      const confirmed = confirm("정말로 누적 점수를 초기화하시겠습니까?");
      if (!confirmed) return;

      state.playerScore = 0;
      state.computerScore = 0;
      state.drawScore = 0;
      playerScoreEl.textContent = 0;
      computerScoreEl.textContent = 0;
      drawScoreEl.textContent = 0;
    }

    // ===== 이벤트 연결 =====
    rollBtn.addEventListener("click", () => {
      if (state.isRolling) return;
      playRollAnimation();
    });

    resetRoundBtn.addEventListener("click", resetRound);
    resetScoreBtn.addEventListener("click", resetScore);
  </script>

</body>
</html>

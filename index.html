<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>집중 타이머</title>
<style>
  :root {
    --bg: #f6f7fa;
    --card: #ffffff;
    --text: #1c2530;
    --muted: #66707f;
    --border: #dce2e9;
    --accent: #3a6ea8;
    --accent-soft: #dce7f1;
    --ring-track: #e3e7ee;
    --warning: #d9534f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1117;
      --card: #161c24;
      --text: #eef1f5;
      --muted: #8a94a3;
      --border: #2a323d;
      --accent: #6ea3d9;
      --accent-soft: #223347;
      --ring-track: #232b35;
      --warning: #ff6b66;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 20px 50px -25px rgba(0,0,0,0.35);
    text-align: center;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 24px;
    letter-spacing: 0.02em;
  }

  /* ---- 설정 화면 ---- */
  .setup { display: flex; flex-direction: column; gap: 18px; }
  .setup[hidden] { display: none; } /* hidden 속성이 항상 이기도록 우선순위 고정 */

  .presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .preset-btn {
    padding: 10px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--accent); }

  .custom-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .custom-row input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  .custom-row span { font-size: 13px; color: var(--muted); }

  .start-btn {
    padding: 12px 0;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .start-btn:hover { opacity: 0.9; }

  .hint { font-size: 12px; color: var(--muted); margin: 0; }

  /* ---- 타이머 화면 ---- */
  .timer { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .timer[hidden] { display: none; }

  .ring-wrap { position: relative; width: 220px; height: 220px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-track { stroke: var(--ring-track); fill: none; }
  .ring-progress {
    stroke: var(--accent);
    fill: none;
    stroke-linecap: round;
    transition: stroke 0.3s ease;
  }
  .ring-wrap.warning .ring-progress { stroke: var(--warning); }
  .ring-wrap.warning { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 0px transparent); }
    50% { filter: drop-shadow(0 0 14px var(--warning)); }
  }

  .time-display {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .ring-wrap.warning .time-display { color: var(--warning); }

  .controls { display: flex; gap: 10px; }
  .ctrl-btn {
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  .ctrl-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ctrl-btn:hover { opacity: 0.85; }
</style>
</head>
<body>

<div class="card">
  <h1>⏱ 집중 타이머</h1>

  <!-- 1) 설정 화면 -->
  <div class="setup" id="setup">
    <div class="presets">
      <button class="preset-btn" data-min="5">5분</button>
      <button class="preset-btn" data-min="10">10분</button>
      <button class="preset-btn" data-min="15">15분</button>
      <button class="preset-btn" data-min="25">25분</button>
    </div>
    <div class="custom-row">
      <input type="number" id="customMinutes" placeholder="직접 입력 (1~180분)" />
      <span>분</span>
    </div>
    <p class="hint">1분 이상 180분 이하로 입력해주세요.</p>
    <button class="start-btn" id="startBtn">시작</button>
  </div>

  <!-- 2) 타이머 화면 -->
  <div class="timer" id="timer" hidden>
    <div class="ring-wrap" id="ringWrap">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle class="ring-track" cx="110" cy="110" r="98" stroke-width="12"></circle>
        <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="98" stroke-width="12"
                stroke-dasharray="615.75" stroke-dashoffset="0"></circle>
      </svg>
      <div class="time-display" id="timeDisplay">00:00</div>
    </div>
    <div class="controls">
      <button class="ctrl-btn primary" id="pauseBtn">일시정지</button>
      <button class="ctrl-btn" id="resetBtn">초기화</button>
    </div>
  </div>
</div>

<script>
  const setupEl = document.getElementById('setup');
  const timerEl = document.getElementById('timer');
  const customInput = document.getElementById('customMinutes');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const ringWrap = document.getElementById('ringWrap');
  const ringProgress = document.getElementById('ringProgress');
  const timeDisplay = document.getElementById('timeDisplay');

  const RING_CIRCUMFERENCE = 2 * Math.PI * 98; // ≈ 615.75
  const ORIGINAL_TITLE = document.title;

  let totalSeconds = 0;   // 이번 세션의 총 시간(초)
  let endAt = null;       // ★ 개선 2: "몇 초 지났나"가 아니라 "언제 끝나는지"를 기준으로 계산
  let remainingAtPause = null; // 일시정지 시점의 남은 시간(초)
  let intervalId = null;
  let running = false;

  // ---------- 개선 1: 입력값 범위 검증 (팝업으로 안내 후 재입력) ----------
  function getValidatedMinutes(rawValue) {
    const value = Number(rawValue);
    if (!rawValue || Number.isNaN(value) || !Number.isFinite(value)) {
      return null;
    }
    if (value <= 0 || value > 180) {
      return null;
    }
    return value;
  }

  function requestCustomStart() {
    const raw = customInput.value.trim();
    const minutes = getValidatedMinutes(raw);
    if (minutes === null) {
      alert('1분 이상 180분 이하의 숫자를 입력해주세요.\n(예: 25)');
      customInput.value = '';
      customInput.focus();
      return;
    }
    startTimer(minutes);
  }

  document.querySelectorAll('.preset-btn').forEach((btn) => {
    btn.addEventListener('click', () => startTimer(Number(btn.dataset.min)));
  });
  startBtn.addEventListener('click', requestCustomStart);
  customInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') requestCustomStart();
  });

  // ---------- 타이머 로직 ----------
  function startTimer(minutes) {
    totalSeconds = Math.round(minutes * 60);
    endAt = Date.now() + totalSeconds * 1000; // ★ 종료 시각을 못박아 둔다
    remainingAtPause = null;
    running = true;

    setupEl.hidden = true;
    timerEl.hidden = false;
    ringWrap.classList.remove('warning');

    tick(); // 첫 화면을 즉시 갱신
    clearInterval(intervalId);
    intervalId = setInterval(tick, 250); // 자주 갱신해도 시각 기준이라 밀리지 않음
  }

  function tick() {
    if (!running || endAt === null) return;

    const remainingMs = endAt - Date.now(); // ★ 지금 이 순간 실제로 남은 시간을 매번 다시 계산
    const remainingSeconds = Math.max(0, Math.round(remainingMs / 1000));

    renderTime(remainingSeconds);

    if (remainingMs <= 0) {
      finishTimer();
    }
  }

  function renderTime(remainingSeconds) {
    const mm = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
    const ss = String(remainingSeconds % 60).padStart(2, '0');
    timeDisplay.textContent = `${mm}:${ss}`;
    document.title = running ? `${mm}:${ss} · 집중 타이머` : ORIGINAL_TITLE;

    const ratio = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
    ringProgress.setAttribute('stroke-dasharray', RING_CIRCUMFERENCE.toFixed(2));
    ringProgress.setAttribute('stroke-dashoffset', (RING_CIRCUMFERENCE * (1 - ratio)).toFixed(2));

    if (remainingSeconds <= 10 && remainingSeconds > 0) {
      ringWrap.classList.add('warning');
    } else {
      ringWrap.classList.remove('warning');
    }
  }

  function finishTimer() {
    running = false;
    clearInterval(intervalId);
    intervalId = null;
    renderTime(0);
    document.title = ORIGINAL_TITLE;
    playBeeps(3);
  }

  pauseBtn.addEventListener('click', () => {
    if (running) {
      // 일시정지: 남은 시간을 저장해두고 endAt은 버린다
      remainingAtPause = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      running = false;
      clearInterval(intervalId);
      pauseBtn.textContent = '재개';
      document.title = ORIGINAL_TITLE;
    } else {
      // 재개: 지금 시각 기준으로 endAt을 다시 못박는다 (경과 카운트가 아니라 종료 시각 기준 유지)
      endAt = Date.now() + (remainingAtPause ?? 0) * 1000;
      running = true;
      pauseBtn.textContent = '일시정지';
      tick();
      clearInterval(intervalId);
      intervalId = setInterval(tick, 250);
    }
  });

  resetBtn.addEventListener('click', resetTimer);

  function resetTimer() {
    running = false;
    clearInterval(intervalId);
    intervalId = null;
    endAt = null;
    remainingAtPause = null;
    pauseBtn.textContent = '일시정지';
    ringWrap.classList.remove('warning');
    document.title = ORIGINAL_TITLE;
    timerEl.hidden = true;
    setupEl.hidden = false;
    customInput.value = '';
  }

  // ---------- 종료 알림음 (WebAudio, 외부 파일 없음) ----------
  function playBeeps(count) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    for (let i = 0; i < count; i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      const start = ctx.currentTime + i * 0.45;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.35, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.28);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.3);
    }
  }
</script>
</body>
</html>
